name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: knowledgehub
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: knowledgehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledgehub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://knowledgehub:ci-password@127.0.0.1:5432/knowledgehub?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate:deploy

      - run: pnpm --filter @knowledgehub/api test:e2e

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/web

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: apps/web

      - run: pnpm test:e2e
        working-directory: apps/web

  changes:
    name: Detect deployable changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - .npmrc
              - .nvmrc
              - .dockerignore
              - .github/workflows/ci.yml
            api:
              - *shared
              - apps/api/**
            web:
              - *shared
              - apps/web/**

  deploy-api:
    name: Deploy api to Railway
    needs: [verify, e2e, changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: railway-api
      cancel-in-progress: true
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install --global @railway/cli@5.71.0

      - run: railway up --ci --service api --environment production -m "${{ github.sha }}"
        timeout-minutes: 20

  deploy-web:
    name: Deploy web to Railway
    needs: [verify, web-e2e, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: railway-knowledgehub-ai
      cancel-in-progress: true
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install --global @railway/cli@5.71.0

      - run: railway up --ci --service knowledgehub-ai --environment production -m "${{ github.sha }}"
        timeout-minutes: 20
