name: knowledgehub

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledgehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledgehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgehub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-knowledgehub} -d ${POSTGRES_DB:-knowledgehub}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Upstream MinIO Community Edition images were withdrawn in September 2026:
  # minio/minio was removed from Docker Hub, quay.io/minio/minio rejects
  # anonymous pulls, and quay.io/minio/aistor/minio requires a license. This
  # maintained MinIO-derived fork is the unlicensed replacement and implements
  # the per-bucket CORS that minio-init applies below.
  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    container_name: knowledgehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    container_name: knowledgehub-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-knowledgehub-documents}
      STORAGE_CORS_ORIGIN: ${STORAGE_CORS_ORIGIN:-http://localhost:3000}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        cat > /tmp/cors.xml <<EOF
        <CORSConfiguration>
          <CORSRule>
            <AllowedOrigin>$$STORAGE_CORS_ORIGIN</AllowedOrigin>
            <AllowedMethod>PUT</AllowedMethod>
            <AllowedHeader>Content-Type</AllowedHeader>
            <ExposeHeader>ETag</ExposeHeader>
            <MaxAgeSeconds>3000</MaxAgeSeconds>
          </CORSRule>
        </CORSConfiguration>
        EOF
        mc cors set "local/$$STORAGE_BUCKET" /tmp/cors.xml

  redis:
    image: redis:7-alpine
    container_name: knowledgehub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: knowledgehub-postgres-data
  minio-data:
    name: knowledgehub-minio-data
  redis-data:
    name: knowledgehub-redis-data
